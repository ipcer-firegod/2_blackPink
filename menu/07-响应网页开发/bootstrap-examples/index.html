<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Bootstrap 示例索引</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
		<style>
			.card-link { text-decoration: none; color: inherit; }
			.search-highlight { background: rgba(255,255,0,0.25); }
		</style>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container">
				<a class="navbar-brand" href="#">Bootstrap 示例</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="nav">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item"><a class="nav-link" href="bootstrap-5.3.8-examples/">示例目录</a></li>
						<li class="nav-item"><a class="nav-link" href="#examples">示例列表</a></li>
					</ul>
				</div>
			</div>
		</nav>

		<main class="container my-4">
			<div class="d-sm-flex align-items-center justify-content-between mb-3">
				<div>
					<h1 class="h3 mb-0">Bootstrap 5.3.8 示例集合</h1>
					<p class="text-muted small mb-0">点击卡片在新标签页打开对应示例。</p>
				</div>
				<div class="w-100 w-sm-50 ms-sm-3" style="max-width:420px;">
					<div class="input-group">
						<span class="input-group-text">搜索</span>
						<input id="filter" type="search" class="form-control" placeholder="按名称过滤示例（例如: navbar, carousel）">
						<button id="clear" class="btn btn-outline-secondary" title="清除">✕</button>
					</div>
				</div>
			</div>

			<div id="examples" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>

			<footer class="mt-4 text-muted small">示例来自 `bootstrap-5.3.8-examples` 文件夹</footer>
		</main>

		<script>
			const examples = [
				{title: 'Album', path: 'bootstrap-5.3.8-examples/album/index.html'},
				{title: 'Badges', path: 'bootstrap-5.3.8-examples/badges/index.html'},
				{title: 'Blog', path: 'bootstrap-5.3.8-examples/blog/index.html'},
				{title: 'Breadcrumbs', path: 'bootstrap-5.3.8-examples/breadcrumbs/index.html'},
				{title: 'Buttons', path: 'bootstrap-5.3.8-examples/buttons/index.html'},
				{title: 'Carousel', path: 'bootstrap-5.3.8-examples/carousel/index.html'},
				{title: 'Cheatsheet', path: 'bootstrap-5.3.8-examples/cheatsheet/index.html'},
				{title: 'Checkout', path: 'bootstrap-5.3.8-examples/checkout/index.html'},
				{title: 'Cover', path: 'bootstrap-5.3.8-examples/cover/index.html'},
				{title: 'Dashboard', path: 'bootstrap-5.3.8-examples/dashboard/index.html'},
				{title: 'Dropdowns', path: 'bootstrap-5.3.8-examples/dropdowns/index.html'},
				{title: 'Features', path: 'bootstrap-5.3.8-examples/features/index.html'},
				{title: 'Footers', path: 'bootstrap-5.3.8-examples/footers/index.html'},
				{title: 'Grid', path: 'bootstrap-5.3.8-examples/grid/index.html'},
				{title: 'Headers', path: 'bootstrap-5.3.8-examples/headers/index.html'},
				{title: 'Heroes', path: 'bootstrap-5.3.8-examples/heroes/index.html'},
				{title: 'Jumbotron', path: 'bootstrap-5.3.8-examples/jumbotron/index.html'},
				{title: 'Jumbotrons', path: 'bootstrap-5.3.8-examples/jumbotrons/index.html'},
				{title: 'List Groups', path: 'bootstrap-5.3.8-examples/list-groups/index.html'},
				{title: 'Masonry', path: 'bootstrap-5.3.8-examples/masonry/index.html'},
				{title: 'Modals', path: 'bootstrap-5.3.8-examples/modals/index.html'},
				{title: 'Navbar Bottom', path: 'bootstrap-5.3.8-examples/navbar-bottom/index.html'},
				{title: 'Navbar Fixed', path: 'bootstrap-5.3.8-examples/navbar-fixed/index.html'},
				{title: 'Navbar Static', path: 'bootstrap-5.3.8-examples/navbar-static/index.html'},
				{title: 'Navbars', path: 'bootstrap-5.3.8-examples/navbars/index.html'},
				{title: 'Navbars Offcanvas', path: 'bootstrap-5.3.8-examples/navbars-offcanvas/index.html'},
				{title: 'Offcanvas', path: 'bootstrap-5.3.8-examples/offcanvas/index.html'},
				{title: 'Offcanvas Navbar', path: 'bootstrap-5.3.8-examples/offcanvas-navbar/index.html'},
				{title: 'Pricing', path: 'bootstrap-5.3.8-examples/pricing/index.html'},
				{title: 'Product', path: 'bootstrap-5.3.8-examples/product/index.html'},
				{title: 'Sidebars', path: 'bootstrap-5.3.8-examples/sidebars/index.html'},
				{title: 'Sign In', path: 'bootstrap-5.3.8-examples/sign-in/index.html'},
				{title: 'Starter Template', path: 'bootstrap-5.3.8-examples/starter-template/index.html'},
				{title: 'Sticky Footer', path: 'bootstrap-5.3.8-examples/sticky-footer/index.html'},
				{title: 'Sticky Footer + Navbar', path: 'bootstrap-5.3.8-examples/sticky-footer-navbar/index.html'}
			];

			const container = document.getElementById('examples');
			const filterInput = document.getElementById('filter');
			const clearBtn = document.getElementById('clear');

			function createCard(item) {
				const col = document.createElement('div');
				col.className = 'col';

				const a = document.createElement('a');
				a.href = item.path;
				a.target = '_blank';
				a.className = 'card h-100 card-link';
				a.rel = 'noopener noreferrer';

				const body = document.createElement('div');
				body.className = 'card-body';

				const h5 = document.createElement('h5');
				h5.className = 'card-title mb-1';
				h5.textContent = item.title;

				const p = document.createElement('p');
				p.className = 'card-text text-muted small mb-0';
				p.textContent = item.path;

				body.appendChild(h5);
				body.appendChild(p);
				a.appendChild(body);
				col.appendChild(a);

				return col;
			}

			function render(list) {
				container.innerHTML = '';
				if (list.length === 0) {
					const empty = document.createElement('div');
					empty.className = 'col-12 text-center text-muted py-4';
					empty.textContent = '未找到匹配的示例。';
					container.appendChild(empty);
					return;
				}
				for (const item of list) container.appendChild(createCard(item));
			}

			function normalize(s) { return s.trim().toLowerCase(); }

			filterInput.addEventListener('input', () => {
				const q = normalize(filterInput.value);
				if (!q) {
					render(examples);
					return;
				}
				const filtered = examples.filter(e => normalize(e.title).includes(q) || normalize(e.path).includes(q));
				render(filtered);
			});

			clearBtn.addEventListener('click', () => { filterInput.value = ''; filterInput.dispatchEvent(new Event('input')); filterInput.focus(); });

			// initial render
			render(examples);
		</script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
