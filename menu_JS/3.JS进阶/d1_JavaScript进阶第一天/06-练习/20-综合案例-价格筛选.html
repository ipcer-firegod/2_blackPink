<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品渲染</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .list {
      width: 990px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
    }

    .item {
      width: 240px;
      margin-left: 10px;
      padding: 20px 30px;
      transition: all .5s;
      margin-bottom: 20px;
    }

    .item:nth-child(4n) {
      margin-left: 0;
    }

    .item:hover {
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
      transform: translate3d(0, -4px, 0);
      cursor: pointer;
    }

    .item img {
      width: 100%;
    }

    .item .name {
      font-size: 18px;
      margin-bottom: 10px;
      color: #666;
    }

    .item .price {
      font-size: 22px;
      color: firebrick;
    }

    .item .price::before {
      content: "¥";
      font-size: 14px;
    }

    .filter {
      display: flex;
      width: 990px;
      margin: 0 auto;
      padding: 50px 30px;
    }

    .filter a {
      padding: 10px 20px;
      background: #f5f5f5;
      color: #666;
      text-decoration: none;
      margin-right: 20px;
    }

    .filter a:active,
    .filter a:focus {
      background: pink;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="filter">
    <a href="javascript:;" data-type="0-100">0-100元</a>
    <a href="javascript:;" data-type="100-300">100-300元</a>
    <a href="javascript:;" data-type="300">300元以上</a>
    <a href="javascript:;">全部区间</a>
  </div>
  <div class="list">
    <!-- <div class="item">
      <img src="" alt="">
      <p class="name"></p>
      <p class="price"></p>
    </div> -->
  </div>


  <script>
    // 初始化数据
    const goodsList = [
      {
        id: '4001172',
        name: '称心如意手摇咖啡磨豆机咖啡豆研磨机',
        price: '289.00',
        picture: 'https://yanxuan-item.nosdn.127.net/84a59ff9c58a77032564e61f716846d6.jpg',
      },
      {
        id: '4001594',
        name: '日式黑陶功夫茶组双侧把茶具礼盒装',
        price: '288.00',
        picture: 'https://yanxuan-item.nosdn.127.net/3346b7b92f9563c7a7e24c7ead883f18.jpg',
      },
      {
        id: '4001009',
        name: '竹制干泡茶盘正方形沥水茶台品茶盘',
        price: '109.00',
        picture: 'https://yanxuan-item.nosdn.127.net/2d942d6bc94f1e230763e1a5a3b379e1.png',
      },
      {
        id: '4001874',
        name: '古法温酒汝瓷酒具套装白酒杯莲花温酒器',
        price: '488.00',
        picture: 'https://yanxuan-item.nosdn.127.net/44e51622800e4fceb6bee8e616da85fd.png',
      },
      {
        id: '4001649',
        name: '大师监制龙泉青瓷茶叶罐',
        price: '139.00',
        picture: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
      },
      {
        id: '3997185',
        name: '与众不同的口感汝瓷白酒杯套组1壶4杯',
        price: '108.00',
        picture: 'https://yanxuan-item.nosdn.127.net/8e21c794dfd3a4e8573273ddae50bce2.jpg',
      },
      {
        id: '3997403',
        name: '手工吹制更厚实白酒杯壶套装6壶6杯',
        price: '100.00',
        picture: 'https://yanxuan-item.nosdn.127.net/af2371a65f60bce152a61fc22745ff3f.jpg',
      },
      {
        id: '3998274',
        name: '德国百年工艺高端水晶玻璃红酒杯2支装',
        price: '139.00',
        picture: 'https://yanxuan-item.nosdn.127.net/8896b897b3ec6639bbd1134d66b9715c.jpg',
      },
    ]

    // 1.渲染函数。arr是一个对象数组，数组一个元素为对象，取出一个对象有多个属性值
    function render(arr) {
      // <!--! 也可以在这里解构赋值
      // arr.forEach(({ name, price, picture }) => {
      // <!--! str在forEach外
      let str = ''
      arr.forEach(ele => {
        const { price, picture, name } = ele
        // <!--! 这里使用 +=
        str += `
        <div class="item">
          <img src="${picture}" alt="">
          <p class="name">${name}</p>
          <p class="price">${price}</p>
        </div>
        `
      })
      // <!--! 注意此行在循环外面
      document.querySelector('.list').innerHTML = str
    }
    // 第二种方法。使用map方法返回一个新数组，再join成字符串
    /*
    function render(arr) {
      const html = arr.map(ele => {
      const { price, picture, name } = ele
      return `
      <div class="item">
        <img src="${item.picture}" alt="">
        <p class="name">${item.name}</p>
        <p class="price">${item.price}</p>
      </div>
      `
      }).join('');
      document.querySelector('.list').innerHTML = html;
    }
    */

    // 2.过滤函数。过滤数组后再渲染一遍。传参传什么？传事件对象 e
    function tofilter(e) {
      /* 第一种写法，原始版
      const {tagName, dataset} = e.target
      if (tagName !== 'A') return
      // 如果没有过滤条件，默认为整个数组
      let filtered = goodsList
      // 否则根据自定义属性type进行过滤（过滤是数组的方法）
      if (dataset.type === '0-100') {
        filtered =  goodsList.filter(item => item.price <= 100)
      }
      else if (dataset.type === '100-300') {
        filtered =  goodsList.filter(item => item.price > 100 && item.price <= 300)
      }
      else if (dataset.type === '300') {
        filtered =  goodsList.filter(item => item.price > 300)
      }
      // 渲染过滤后的数组
     render(filtered) */

      // 下面是一种优化的写法
      /* // 这种初始写法（确认获取所需元素，保证点击其他元素不会误击）比较复杂，改成下面那样的解构赋值 
      const a = e.target.closest('a')
      if (!a || !document.querySelector('.filter').contains(a)) return
      const type = e.target.getAttribute('data-type') 
      // 上面一行：getAttribute是获取自定义属性的另一种方法。无则返回null，下面if (!type) 处需要使用type === null判断 */

      const { tagName, dataset } = e.target
      const { type } = dataset // type = dataset.type 解构如左
      if (tagName !== 'A') return

      let arr = []
      // 如果没有过滤条件，默认为整个数组
      if (!type) { // 不存在、空字符串都为假。这里具体为 typeof type === 'undefined'
        arr = [...goodsList] //<!--? arr = goodsList 有什么区别？Me.md
      } else if (type.includes('-')) {
        // <!--! 数组解构、split分割返回数组
        const [min, max] = type.split('-').map(ele => Number(ele))
        arr = goodsList.filter(ele => {
          const price = Number(ele.price)
          return price >= min && price <= max
        })
      } else {
        const min = Number(type)
        arr = goodsList.filter(ele => {
          const price = Number(ele.price)
          return price >= min
        })
      }
      render(arr)
    }

    function bind() {
      // 点击一个 a 标签进行过滤，利用事件委托，只需要绑定事件在父元素上；同时注意这里函数没有参数列表
      document.querySelector('.filter').addEventListener('click', tofilter)
    }

    function init() {
      render(goodsList)
      bind()
    }

    init()

  </script>
</body>

</html>
