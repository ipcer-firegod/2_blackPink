<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>英雄</title>
  <link rel="stylesheet" href="./css/hero.css" />
  <link rel="stylesheet" href="./css/comm-v1.css" />
</head>

<body>
  <div class="herolist-box">
    <div class="clearfix herolist-types">
      <ul class="types-left">
        <li>综合</li>
        <li>定位</li>
      </ul>
      <ul class="clearfix types-ms">
        <li class="current" data-ptype="0">
          <span class="ms-radio"><i class="i"></i></span>
          <label>全部</label>
        </li>
        <li data-ptype="1">
          <span class="ms-radio"><i class="i"></i></span>
          <label>本周免费</label>
        </li>
        <li data-ptype="10">
          <span class="ms-radio"><i class="i"></i></span>
          <label>付费英雄</label>
        </li>
      </ul>
      <ul class="clearfix types-ms">
        <li class="current" data-type="0">
          <span class="ms-radio"><i class="i"></i></span>
          <label>全部</label>
        </li>
        <li data-type="3">
          <span class="ms-radio"><i class="i"></i></span>
          <label>坦克</label>
        </li>
        <li data-type="1">
          <span class="ms-radio"><i class="i"></i></span>
          <label>战士</label>
        </li>
        <li data-type="4">
          <span class="ms-radio"><i class="i"></i></span>
          <label>刺客</label>
        </li>
        <li data-type="2">
          <span class="ms-radio"><i class="i"></i></span>
          <label>法师</label>
        </li>
        <li data-type="5">
          <span class="ms-radio"><i class="i"></i></span>
          <label>射手</label>
        </li>
        <li data-type="6">
          <span class="ms-radio"><i class="i"></i></span>
          <label>辅助</label>
        </li>
      </ul>
    </div>
    <div class="herolist-content">
      <ul class="herolist clearfix">
        <!-- <li >
          <a href="#" target="_blank"><img src="" width="91" height="91" alt="曜" />曜</a>
        </li> -->
      </ul>
    </div>
  </div>

  <!-- 数组比较多，放在了外接的js文件中 -->
  <script src="./hero.js"></script>
  <script>
    (function () {
      const heroListEl = document.querySelector('.herolist')
      const filtersContainer = document.querySelector('.herolist-types')

      // 渲染函数：接收数组并渲染到 .herolist
      function render(arr) {
        const html = arr.map(({ icon, name }) => `
        <li>
          <a href="#" target="_blank"><img src="${icon}" width="91" height="91" alt="${name}" />${name}</a>
        </li>
        `).join('')
        heroListEl.innerHTML = html
      }

      // 通用选择读取函数：按位置('first'|'last')读取对应 .types-ms 组内的 .current 节点
      // dataKey 为 dataset 的 key（'ptype' 或 'type'），allValue 表示“全部”的数值（例如 0），如果匹配则视为不过滤，返回 null
      function getSelectedByPosition(position, dataKey, allValue = 0) {
        const groups = document.querySelectorAll('.types-ms')
        if (!groups || groups.length === 0) return null
        const group = position === 'first' ? groups[0] : groups[groups.length - 1]
        const node = group.querySelector('.current')
        if (!node) return null
        const raw = node.dataset[dataKey] // <!--? dataset[key] = value (dataset.key = value) 有什么区别？
        if (typeof raw === 'undefined') return null // <!--? 是否可以直接写成 !raw ？
        const num = Number(raw)
        if (!Number.isFinite(num)) return null  // <!--? isFinite 作用、为何？
        // 如果指定了 allValue，且等于该值，则认为是“全部”，不应过滤
        if (typeof allValue === 'number' && num === allValue) return null
        return num
      }

      // 根据当前筛选条件对数组进行过滤并返回过滤后的新数组
      function applyFilters(list) {
        // 获取付费类型（第一组）和英雄类型（最后一组）
        const ptype = getSelectedByPosition('first', 'ptype', 0)
        const type = getSelectedByPosition('last', 'type', 0)

        // 使用一次拷贝，随后按需过滤；对数据字段做安全转换
        let result = list.slice() // <!--? slice()可浅拷贝数组。那为什么不直接 = 
        if (ptype !== null) {
          result = result.filter(ele => Number(ele.pay_type) === ptype) // 满足条件的才留下
        }
        if (type !== null) {
          result = result.filter(ele => Number(ele.hero_type) === type)
        }
        return result
      }

      // 事件处理：使用事件委托，处理 types-ms 内的 li 点击
      function handleTypeClick(e) {
        // 获取最近的 li 元素（点击的）
        const li = e.target.closest('li')
        if (!li) return
        const parent = li.parentElement
        if (!parent || !parent.classList.contains('types-ms')) return

        // 排他处理：给当前 li 加上 current，并移除兄弟的 current
        parent.querySelectorAll('li').forEach(item => item.classList.remove('current'))
        li.classList.add('current')

        // 筛选并渲染
        let arr = [...heroArr]
        arr = applyFilters(arr)
        render(arr)
      }

      function bind() {
        // 在父容器上委托，避免为每个 li 单独绑定事件
        filtersContainer.addEventListener('click', handleTypeClick)
      }

      function init() {
        render(heroArr)
        bind()
      }

      // 只在这里直接调用 init
      init()
    })()
  </script>
</body>

</html>
