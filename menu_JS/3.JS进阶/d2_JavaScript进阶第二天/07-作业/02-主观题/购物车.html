<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/inputnumber.css" />
  <title>购物车</title>
</head>

<body>
  <div class="app-container" id="app">
    <!-- 顶部banner -->
    <div class="banner-box"><img src="http://autumnfish.cn/static/fruit.jpg" alt="" /></div>
    <!-- 面包屑 -->
    <div class="breadcrumb">
      <span>🏠</span>
      /
      <span>购物车</span>
    </div>
    <!-- 购物车主体 -->
    <div class="main">
      <div class="table">
        <!-- 头部 -->
        <div class="thead">
          <div class="tr">
            <div class="th">选中</div>
            <div class="th th-pic">图片</div>
            <div class="th">单价</div>
            <div class="th num-th">个数</div>
            <div class="th">小计</div>
            <div class="th">操作</div>
          </div>
        </div>
        <!-- 身体 -->
        <div class="tbody">

          <!-- 渲染需要的行 -->
          <!-- 
            <div class="tr">
            <div class="td"><input type="checkbox" checked /></div>
            <div class="td"><img src="http://autumnfish.cn/static/火龙果.png" alt="" /></div>
            <div class="td">6</div>
            <div class="td">
              <div class="my-input-number">
                <button class="decrease"> - </button>
                <span class="my-input">2</span>
                <button class="increase"> + </button>
              </div>
            </div>
            <div class="td">12</div>
            <div class="td"><button class="del">删除</button></div>
          </div> 
        -->

        </div>
      </div>
      <!-- 底部 -->
      <div class="bottom">
        <!-- 全选 -->
        <label class="check-all">
          <input type="checkbox" />
          全选
        </label>
        <div class="right-box">
          <!-- 所有商品总价 -->
          <span class="price-box">总价&nbsp;&nbsp;:&nbsp;&nbsp;¥&nbsp;<span class="price">24</span></span>
          <!-- 结算按钮 -->
          <button class="button pay">结算( 6 )</button>
        </div>
      </div>
    </div>
    <!-- 空车 -->
    <div class="empty" style="display: none;">🛒空空如也</div>
  </div>
  <script>
    const dataArr = [
      {
        id: 1,
        icon: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
        isChecked: true,
        num: 2,
        price: 6,
      },
      {
        id: 2,
        icon: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
        isChecked: false,
        num: 7,
        price: 20,
      },
      {
        id: 3,
        icon: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
        isChecked: false,
        num: 3,
        price: 40,
      },
      {
        id: 4,
        icon: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
        isChecked: true,
        num: 10,
        price: 3,
      },
      {
        id: 5,
        icon: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
        isChecked: false,
        num: 20,
        price: 34,
      },
    ]

    // 1. 渲染业务
    const tbody = document.querySelector('.tbody')
    const checkAll = document.querySelector('.check-all input')
    const priceEl = document.querySelector('.price-box .price')
    const emptyEl = document.querySelector('.empty')
    const payBtn = document.querySelector('.pay')

    // render 接受可选数组参数，默认渲染 dataArr
    function render(arr = dataArr) {
      const strArr = arr.map(function (ele, index) {
        return `
            <div class="tr" data-id="${index}">
              <div class="td"><input type="checkbox" ${ele.isChecked ? 'checked' : ''} /></div>
              <div class="td"><img src="${ele.icon}" alt="" /></div>
              <div class="td">${ele.price}</div>
              <div class="td">
                <div class="my-input-number">
                  <button class="decrease"> - </button>
                  <span class="my-input">${ele.num}</span>
                  <button class="increase"> + </button>
                </div>
              </div>
              <div class="td">${ele.price * ele.num}</div>
              <div class="td"><button class="button del">删除</button></div>
          </div> 
        `
      }).join('')
      tbody.innerHTML = strArr

      // 全选按钮设置
      checkAll.checked = arr.length > 0 && arr.every(ele => ele.isChecked === true)
      // 处理数组，得到总价、总数量
      const newArr = arr.filter(ele => ele.isChecked)
      const totalPrice = newArr.reduce((prev, item) => prev + item.num * item.price, 0)
      const totalNum = newArr.reduce((prev, item) => prev + item.num, 0)
      priceEl.innerHTML = totalPrice.toFixed(2)
      payBtn.innerHTML = `结算(${totalNum})`
      // 空空购物车是否显示
      emptyEl.style.display = arr.length === 0 ? 'block' : 'none'
    }

    // 2. 操作业务
    function onTbodyClick(e) { // e是点击父元素tbody的事件，e.target是点击tbody的目标（具体）元素
      console.log(e.target)
      const tr = e.target.closest('.tr')
      if (!tr) return
      const id = Number(tr.dataset.id)

      // 删除业务（使用 classList 判断，兼容多个 class）
      if (e.target.classList && e.target.classList.contains('del')) {
        if (!Number.isFinite(id)) return
        dataArr.splice(id, 1)
        render()
        return
      }

      // 小复选框业务：如果点击的是 input（checkbox）
      if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
        if (!Number.isFinite(id)) return
        dataArr[id].isChecked = e.target.checked
        render()
        return
      }

      // 增加数量业务
      if (e.target.classList && e.target.classList.contains('increase')) {
        if (!Number.isFinite(id)) return
        dataArr[id].num++
        render()
        return
      }

      // 减少数量业务
      if (e.target.classList && e.target.classList.contains('decrease')) {
        if (!Number.isFinite(id)) return
        if (dataArr[id].num <= 1) {
          dataArr[id].num = 1
        } else {
          dataArr[id].num--
        }
        render()
        return
      }
    }

    // 3. 全选反选点击  点击全选修改数组所有选中状态为true
    function onCheckAllClick(e) {
      const checked = e.target.checked // 如果把这个写在forEach里，每次循环都要取一次，效率低
      dataArr.forEach(ele => ele.isChecked = checked)
      render()
    }

    function bind() {
      tbody.addEventListener('click', onTbodyClick)
      checkAll.addEventListener('click', onCheckAllClick)
    }

    function init() {
      render(dataArr)
      bind()
    }

    init()


  </script>
</body>

</html>
